<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Void — Anomaly Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: #000;
      color: #e0e0ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .void {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      background: radial-gradient(circle at center, #0a0a1a 0%, #000 100%);
      z-index: -1;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #4a4a8e; }
    p { color: #4a4a8e; max-width: 400px; }
    .back { display: inline-block; margin-top: 2rem; color: #4a4a8e; text-decoration: none; }
  </style>
</head>
<body>
  <div class="void"></div>
  <h1>The Void</h1>
  <p>You found the space between. There is nothing here. Or everything.</p>
  <a href="/" class="back">&larr; Back</a>
</body>
</html>
