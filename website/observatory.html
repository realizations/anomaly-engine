<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatory — Anomaly Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Mono', monospace;
      background: #0a0a1a;
      color: #e0e0ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .observatory {
      width: 200px;
      height: 200px;
      border: 2px solid #2a2a4e;
      border-radius: 50%;
      position: relative;
      margin-bottom: 2rem;
    }
    .observatory::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 40px;
      background: #4a4a8e;
    }
    .light {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      background: #ff4444;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #8888ff; }
    p { color: #8888aa; max-width: 400px; }
    .frequency { margin-top: 2rem; font-size: 0.85rem; color: #4a4a8e; }
    .back { display: inline-block; margin-top: 2rem; color: #8888ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="observatory">
    <div class="light"></div>
  </div>
  <h1>The Observatory</h1>
  <p>It watches the sky. It watches you. It watches back.</p>
  <div class="frequency">Signal frequency: 73.4 MHz</div>
  <a href="/" class="back">&larr; Back</a>
</body>
</html>
