name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Renderer
        run: |
          cd src/Engine
          npm install
          npm run build

      - name: Build Native Host
        run: |
          cd src/AnomalyEngine
          dotnet build

      - name: Test
        run: |
          cd src/Engine
          npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint
        run: |
          cd src/Engine
          npm install
          npm run lint
