name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The licence gate is fast and platform independent, so it fails first and
  # cheaply. It is the check that keeps a non-commercial asset out of a repo
  # that may later ship a paid tier.
  license:
    name: Asset licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prove the gate rejects bad licences
        run: node tools/license-gate.mjs --selftest
      - name: Check every shipped asset
        run: node tools/license-gate.mjs

  engine:
    name: Renderer (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: src/Engine
        run: npm install
      # `npm run typecheck` runs tsc twice: once over src/, and once over src/ and
      # tests/ together. The second pass exists because vitest transpiles without
      # type-checking, so without it 377 tests could pass while containing argument
      # types the compiler says cannot exist -- which is exactly what it found.
      - name: Typecheck
        working-directory: src/Engine
        run: npm run typecheck
      - name: Lint
        working-directory: src/Engine
        run: npx eslint src/ tests/
      - name: Unit tests
        working-directory: src/Engine
        run: npm test
      # The host-side and repository-wide gates, run here rather than only in verify.mjs
      # because verify.mjs needs a Windows host build and this job is the one that runs
      # on every push without one.
      - name: Secret scan (self-test and repository)
        run: |
          node tools/secret-scan.mjs --selftest
          node tools/secret-scan.mjs
      - name: Host event wiring (self-test and repository)
        run: |
          node tools/verify-host-events.mjs --selftest
          node tools/verify-host-events.mjs
      - name: Dead code (self-test and repository)
        run: |
          node tools/verify-dead-code.mjs --selftest
          node tools/verify-dead-code.mjs
      - name: Wiring (self-test and repository)
        run: |
          node tools/verify-wiring.mjs --selftest
          node tools/verify-wiring.mjs
      - name: Accessibility wiring (self-test and repository)
        run: |
          node tools/verify-accessibility.mjs --selftest
          node tools/verify-accessibility.mjs
      - name: Documentation (self-test and repository)
        run: |
          node tools/verify-docs.mjs --selftest
          node tools/verify-docs.mjs
      - name: World schema (self-test and repository)
        run: |
          node tools/verify-world-schema.mjs --selftest
          node tools/verify-world-schema.mjs
      - name: World validator
        run: node tools/world-folder.mjs
      - name: Release pipeline (self-test and repository)
        run: |
          node tools/verify-release.mjs --selftest
          node tools/verify-release.mjs
      - name: No network access (self-test and repository)
        run: |
          node tools/verify-no-network.mjs --selftest
          node tools/verify-no-network.mjs
      - name: Event feed fetcher
        run: node tools/event-feed.mjs

  # The host and the end-to-end suite must run on Windows: the wallpaper host is
  # a WPF/WebView2 app, and the e2e suite loads the renderer over file://, which
  # is the only condition that catches module and CORS regressions.
  host:
    name: Native host + end-to-end (file://)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install renderer deps
        working-directory: src/Engine
        run: npm install

      - name: Install tooling deps
        working-directory: tools
        run: npm install

      - name: Install Playwright Chromium
        working-directory: tools
        run: npx playwright install chromium

      # Build from a clean tree. This is deliberate: it verifies the renderer is
      # actually produced and deployed by `dotnet build`, which a stale committed
      # artefact used to mask.
      - name: Build native host (builds and deploys the renderer)
        working-directory: src/AnomalyEngine
        run: dotnet build

      - name: Verify the deployed renderer exists
        shell: pwsh
        run: |
          $p = 'src/AnomalyEngine/bin/Debug/net8.0-windows/renderer/index.html'
          if (-not (Test-Path $p)) { throw "Deployed renderer missing: $p" }
          $html = Get-Content $p -Raw
          if ($html -notmatch 'assets/index-') { throw "index.html does not reference a built bundle" }
          if ($html -match 'main\.ts') { throw "index.html references raw TypeScript; the build is wrong" }
          Write-Output "deployed renderer OK"

      - name: End-to-end, licence gate and durable-state checks
        working-directory: tools
        run: node verify.mjs
