<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Town That Wasn't There</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #anomaly-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: #e0e0ff;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #anomaly-hint.visible { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="anomaly-hint"></div>
  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('anomaly-hint');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const stars = Array.from({ length: 200 }, () => ({
      x: Math.random(),
      y: Math.random() * 0.6,
      size: Math.random() * 1.5 + 0.5,
      twinkle: Math.random() * Math.PI * 2
    }));

    const clouds = Array.from({ length: 5 }, () => ({
      x: Math.random(),
      y: Math.random() * 0.3 + 0.05,
      width: Math.random() * 0.3 + 0.15,
      speed: (Math.random() * 0.02 + 0.005) * (Math.random() > 0.5 ? 1 : -1),
      opacity: Math.random() * 0.4 + 0.2,
    }));

    const zones = [
      { id: 'observatory', name: 'Observatory', x: 0.5, y: 0.3, width: 0.1, height: 0.15, hint: 'The observatory watches.' },
      { id: 'forest', name: 'Forest', x: 0.1, y: 0.5, width: 0.3, height: 0.3, hint: 'Something moves in the pines.' },
      { id: 'cabin', name: 'Cabin', x: 0.1, y: 0.6, width: 0.1, height: 0.1, hint: 'The cabin is warm.' },
      { id: 'radio-tower', name: 'Radio Tower', x: 0.7, y: 0.2, width: 0.1, height: 0.2, hint: 'The tower transmits.' },
    ];

    let mouseX = -1, mouseY = -1;
    let hoveredZone = null;

    canvas.addEventListener('mousemove', (e) => {
      mouseX = e.clientX / window.innerWidth;
      mouseY = e.clientY / window.innerHeight;
      checkHover();
    });

    canvas.addEventListener('click', (e) => {
      const x = e.clientX / window.innerWidth;
      const y = e.clientY / window.innerHeight;
      for (const zone of zones) {
        if (x >= zone.x && x <= zone.x + zone.width && y >= zone.y && y <= zone.y + zone.height) {
          window.dispatchEvent(new CustomEvent('anomaly:zone-click', { detail: { zoneId: zone.id } }));
        }
      }
    });

    function checkHover() {
      if (mouseX < 0) return;
      for (const zone of zones) {
        if (mouseX >= zone.x && mouseX <= zone.x + zone.width && mouseY >= zone.y && mouseY <= zone.y + zone.height) {
          if (hoveredZone !== zone) {
            hoveredZone = zone;
            showHint(zone.hint);
            canvas.style.cursor = 'pointer';
          }
          return;
        }
      }
      if (hoveredZone) {
        hoveredZone = null;
        hideHint();
        canvas.style.cursor = 'default';
      }
    }

    function showHint(text) {
      hint.textContent = text;
      hint.classList.add('visible');
    }

    function hideHint() {
      hint.classList.remove('visible');
    }

    function render(time) {
      const w = canvas.width;
      const h = canvas.height;
      const hour = time.getHours() + time.getMinutes() / 60;

      let topR, topG, topB, botR, botG, botB, starOpacity;

      if (hour >= 5 && hour < 8) {
        const t = (hour - 5) / 3;
        topR = 20 + t * 80; topG = 20 + t * 130; topB = 50 + t * 170;
        botR = 60 + t * 160; botG = 40 + t * 120; botB = 70 + t * 150;
        starOpacity = 0.6 - t * 0.5;
      } else if (hour >= 8 && hour < 17) {
        topR = 100; topG = 150; topB = 220;
        botR = 180; botG = 200; botB = 230;
        starOpacity = 0;
      } else if (hour >= 17 && hour < 20) {
        const t = (hour - 17) / 3;
        topR = 120 - t * 80; topG = 100 - t * 70; topB = 180 - t * 150;
        botR = 220 - t * 200; botG = 140 - t * 120; botB = 80 - t * 50;
        starOpacity = t * 0.5;
      } else {
        topR = 5; topG = 5; topB = 20;
        botR = 15; botG = 15; botB = 35;
        starOpacity = 0.9;
      }

      const gradient = ctx.createLinearGradient(0, 0, 0, h);
      gradient.addColorStop(0, `rgb(${topR|0},${topG|0},${topB|0})`);
      gradient.addColorStop(1, `rgb(${botR|0},${botG|0},${botB|0})`);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);

      if (starOpacity > 0) {
        const t = time.getTime() / 1000;
        for (const star of stars) {
          const alpha = starOpacity * (0.5 + 0.5 * Math.sin(t * 2 + star.twinkle));
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.beginPath();
          ctx.arc(star.x * w, star.y * h, star.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (const cloud of clouds) {
        cloud.x += cloud.speed / 60;
        if (cloud.x > 1.2) cloud.x = -0.2;
        if (cloud.x < -0.2) cloud.x = 1.2;
        const x = cloud.x * w;
        const y = cloud.y * h;
        const cw = cloud.width * w;
        ctx.fillStyle = `rgba(255,255,255,${cloud.opacity * (hour >= 8 && hour < 17 ? 0.5 : 0.2)})`;
        ctx.beginPath();
        ctx.ellipse(x, y, cw / 2, cw / 6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      const horizon = h * 0.65;

      const ambient = hour >= 8 && hour < 17 ? 1 : (hour >= 5 && hour < 8 ? 0.5 : (hour >= 17 && hour < 20 ? 0.7 : 0.15));

      ctx.fillStyle = `rgba(20,30,20,${0.3 + ambient * 0.2})`;
      ctx.beginPath();
      ctx.moveTo(0, horizon);
      for (let x = 0; x <= w; x += 20) {
        const y = horizon - Math.sin(x * 0.005) * 30 - Math.sin(x * 0.01) * 15;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();

      const treeColor = `rgba(15,35,15,${0.5 + ambient * 0.3})`;
      ctx.fillStyle = treeColor;
      for (let i = 0; i < 30; i++) {
        const x = (i / 30) * w + Math.sin(i * 7) * 20;
        const height = 40 + Math.sin(i * 13) * 20;
        const y = horizon + 10;
        ctx.beginPath();
        ctx.moveTo(x, y - height);
        ctx.lineTo(x - 12, y);
        ctx.lineTo(x + 12, y);
        ctx.closePath();
        ctx.fill();
      }

      const cabinX = w * 0.15;
      const cabinY = horizon + 20;
      const cabinW = 80;
      const cabinH = 50;
      ctx.fillStyle = `rgba(60,40,30,${0.5 + ambient * 0.3})`;
      ctx.fillRect(cabinX - cabinW / 2, cabinY - cabinH, cabinW, cabinH);
      ctx.fillStyle = `rgba(40,25,15,${0.5 + ambient * 0.3})`;
      ctx.beginPath();
      ctx.moveTo(cabinX - cabinW / 2 - 5, cabinY - cabinH);
      ctx.lineTo(cabinX, cabinY - cabinH - 25);
      ctx.lineTo(cabinX + cabinW / 2 + 5, cabinY - cabinH);
      ctx.closePath();
      ctx.fill();

      const windowGlow = ambient < 0.3 ? 0.8 : 0.1;
      ctx.fillStyle = `rgba(255,200,100,${windowGlow})`;
      ctx.fillRect(cabinX - 15, cabinY - cabinH + 15, 12, 12);
      ctx.fillRect(cabinX + 5, cabinY - cabinH + 15, 12, 12);

      const towerX = w * 0.75;
      const towerY = horizon - 10;
      const towerH = 120;
      ctx.strokeStyle = `rgba(80,80,80,${0.5 + ambient * 0.3})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(towerX - 15, towerY);
      ctx.lineTo(towerX, towerY - towerH);
      ctx.lineTo(towerX + 15, towerY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(towerX - 10, towerY - towerH * 0.3);
      ctx.lineTo(towerX + 10, towerY - towerH * 0.3);
      ctx.moveTo(towerX - 7, towerY - towerH * 0.6);
      ctx.lineTo(towerX + 7, towerY - towerH * 0.6);
      ctx.stroke();

      const blinkOn = Math.floor(time.getTime() / 1000) % 2 === 0;
      if (blinkOn) {
        ctx.fillStyle = `rgba(255,50,50,${0.5 + ambient * 0.5})`;
        ctx.beginPath();
        ctx.arc(towerX, towerY - towerH, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      const obsX = w * 0.55;
      const obsY = horizon - 5;
      ctx.fillStyle = `rgba(50,50,60,${0.5 + ambient * 0.3})`;
      ctx.fillRect(obsX - 20, obsY - 40, 40, 40);
      ctx.beginPath();
      ctx.arc(obsX, obsY - 40, 20, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = `rgba(30,30,40,${0.5 + ambient * 0.3})`;
      ctx.fillRect(obsX - 3, obsY - 55, 6, 15);

      const obsLightOn = ambient < 0.2 && Math.random() < 0.01;
      if (obsLightOn) {
        ctx.fillStyle = 'rgba(255,200,100,0.8)';
        ctx.beginPath();
        ctx.arc(obsX, obsY - 45, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(() => render(new Date()));
    }

    render(new Date());
  </script>
</body>
</html>
